<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>英語小教室</title>
<style>
/* ===== 英語小教室 UI v4:日系清新 × 現代極簡 =====
   70% 暖白/中性 · 20% 鼠尾草綠 · 10% 奶油黃 */
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap");
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#FAF8F3;--card:#FFFFFF;--tx:#2F3A36;--mu:#5F6B64;--bd:#E8E4DA;--line:#E1E7E1;
--sage:#4F7F6B;--sage-d:#3F6A58;--sage-s:#EAF2EC;--sage-l:#CFE0D6;
--cream:#F3E3B4;--cream-s:#FBF4DC;--cream-l:#EAD99C;--cream-d:#7A672B;
--pr:#4F7F6B;--ok:#3F7A5F;--ng:#B0553F;--r:18px;
--sh:0 1px 2px rgba(47,58,54,.05),0 8px 20px -12px rgba(47,58,54,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 "Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:28px 20px 56px;overflow-wrap:anywhere}
#app{display:flex;flex-wrap:wrap;align-content:flex-start;column-gap:8px}
#app>*{flex:0 0 100%;box-sizing:border-box;min-width:0}

/* 標題 */
h1{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:.01em;margin:4px 0 22px}
h1::after{content:"每天一點點,慢慢變厲害";display:block;margin-top:6px;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}

/* 基礎元件 */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin:0 0 16px;box-shadow:var(--sh)}
button{font:inherit;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:48px;padding:10px 16px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .18s,background .18s,box-shadow .18s,transform .18s}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(79,127,107,.35);outline-offset:2px}
button.p{background:var(--sage);color:#fff;border-color:var(--sage);text-align:center;min-height:54px;font-size:17px;box-shadow:0 1px 2px rgba(63,106,88,.3)}
button.p:hover{background:var(--sage-d);border-color:var(--sage-d)}
input,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px 14px;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:12px}
.bar{height:8px;border-radius:99px;background:#EEF1EC;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .5s ease}

/* 學習成果:重點突出正確率,無色塊 */
h1+.card{padding:20px 22px 22px}
h1+.card .row{display:flex;align-items:flex-end;justify-content:flex-start;gap:0}
h1+.card .row span{flex:1;font-size:0;line-height:1;padding:0 14px;border-left:1px solid var(--bd)}
h1+.card .row span:first-child{padding-left:0;border-left:0}
h1+.card .row span::before{display:block;margin-bottom:10px;font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--mu)}
h1+.card .row span:nth-child(1)::before{content:"累計作答"}
h1+.card .row span:nth-child(2)::before{content:"正確率"}
h1+.card .row span:nth-child(3)::before{content:"單字庫"}
h1+.card .row span::after{font-size:13px;color:var(--mu);margin-left:3px}
h1+.card .row span:nth-child(1)::after{content:"題"}
h1+.card .row span:nth-child(3)::after{content:"字"}
h1+.card .row b{font-family:"Nunito",sans-serif;font-size:28px;font-weight:700;line-height:1;color:var(--tx)}
h1+.card .row span:nth-child(2) b{font-size:42px;font-weight:800;color:var(--sage)}
h1+.card .bar{margin:18px 0 0!important}

/* 主要學習功能:統一白卡 + 細色條 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid>button[data-m]:not(.p){position:relative;display:flex;align-items:center;min-height:76px;padding:16px 18px 16px 26px;font-size:16.5px;font-weight:600;line-height:1.35;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.grid>button[data-m]:not(.p)::before{content:"";position:absolute;left:11px;top:50%;width:4px;height:28px;margin-top:-14px;border-radius:99px;background:var(--bar,var(--sage-l))}
.grid>button[data-m=mix]:not(.p){--bar:#4F7F6B;grid-column:1/-1;min-height:88px;font-size:18px;font-weight:700;background:var(--sage-s);border-color:var(--sage-l)}
.grid>button[data-m=listen]:not(.p){--bar:#78A894}
.grid>button[data-m=read]:not(.p){--bar:#9FC4B2}
.grid>button[data-m=write]:not(.p){--bar:#E0C77F}
.grid>button[data-m=gram]:not(.p){--bar:#8FA79B}
.grid>button[data-m=wrong]:not(.p){--bar:#D9BF6A;min-height:68px;background:var(--cream-s);border-color:var(--cream-l)}
.grid>button[data-m]:not(.p) .mu{font-size:13px;font-weight:500;color:var(--cream-d)}
.grid>button[data-m]:not(.p):hover{border-color:var(--sage);transform:translateY(-1px);box-shadow:0 2px 4px rgba(47,58,54,.06),0 12px 24px -14px rgba(47,58,54,.22)}
.grid>button[data-m=wrong]:not(.p):hover{border-color:#D9BF6A}

/* 說明文字與設定(降低視覺權重) */
#app>p.mu{order:5;margin:6px 2px 20px;line-height:1.7}
#app>button[data-a=rate],#app>button[data-a=auto]{order:6;flex:0 0 auto;min-height:44px;margin:0 0 8px!important;padding:8px 16px;font-size:13.5px;font-weight:500;color:var(--mu);background:transparent;border-radius:99px}
#app>button[data-a=rate]:hover,#app>button[data-a=auto]:hover{background:var(--card);color:var(--tx)}
.card:has(>details){order:7;background:transparent;border:0;box-shadow:none;padding:0;margin:14px 0 0}
.card:has(>details)::before{content:"設定與工具";display:block;margin-bottom:4px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--mu)}
.card details{border-top:1px solid var(--bd);font-size:15.5px;line-height:1.8}
.card details:last-of-type{border-bottom:1px solid var(--bd)}
summary{min-height:48px;box-sizing:border-box;padding:12px 2px;font-size:15px;font-weight:500;color:var(--mu);cursor:pointer}
details[open]>summary{color:var(--tx);font-weight:600}
.card details h4{margin:16px 0 2px;font-size:15px;font-weight:700;color:var(--sage-d)}
textarea{min-height:120px;font-size:15px}

/* 答題介面 */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#app>.row{margin:0 0 8px}
.row>button[data-a=home]{min-height:44px;margin-left:-10px;padding:8px 12px;font-weight:500;color:var(--mu);background:transparent;border-color:transparent}
#app>.bar{margin:6px 0 18px!important}
.tag{display:inline-block;padding:2px 12px;font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--sage-d);background:var(--sage-s);border:0;border-radius:99px}
.q{margin:14px 0 8px;font-size:28px;font-weight:700;line-height:1.35;letter-spacing:.01em;word-break:break-word}
.opt{display:block;width:100%;min-height:58px;margin-top:10px;padding:14px 18px;font-size:18px;font-weight:500;line-height:1.4;background:#fff;border:1.5px solid var(--line);border-radius:16px}
.opt:hover:not(:disabled){border-color:var(--sage);background:#F6FAF7}
.opt:disabled{opacity:1;color:var(--tx);cursor:default}
.opt.ok{background:var(--sage-s);border-color:var(--sage)!important}
.opt.ng{background:#FCEFEA;border-color:#D8A090!important}
.opt.ok::after{content:"✓";float:right;font-weight:800;color:var(--ok)}
.opt.ng::after{content:"✕";float:right;font-weight:800;color:var(--ng)}
input.ok{background:var(--sage-s);border-color:var(--sage)!important}
input.ng{background:#FCEFEA;border-color:#D8A090!important}
button[data-a=sayv]{min-width:54px;padding:0;font-size:19px;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:16px}
button[data-a=sayv]:hover{border-color:var(--sage);background:var(--sage-s)}
button[data-a=say],button[data-a=say2]{min-height:44px;margin:6px 0 8px;padding:8px 18px;font-size:15px;color:var(--sage-d);background:var(--sage-s);border:0;border-radius:99px;text-align:center}
button[data-a=say]:hover,button[data-a=say2]:hover{background:var(--sage-l)}
#ans{margin:4px 0 12px;padding:16px;font-size:24px;font-weight:600;letter-spacing:.03em;text-align:center;border:1.5px solid var(--line);border-radius:16px}
#ans:focus{border-color:var(--sage)}
#fb{margin-top:20px;padding-top:18px;border-top:1px solid var(--bd)}
#fb>p:first-child{margin:0 0 6px;font-size:20px;font-weight:700}
#fb .p{width:100%;margin-top:14px!important}

/* 動畫 */
#app>*{animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 響應式 */
@media(max-width:380px){main{padding:20px 14px 48px}h1{font-size:25px}.q{font-size:24px}.opt{font-size:16.5px;padding:12px 14px}.grid>button[data-m]:not(.p){font-size:15px;padding:14px 12px 14px 22px}h1+.card .row span{padding:0 10px}h1+.card .row span:nth-child(2) b{font-size:36px}}
.seg{display:flex;gap:4px;padding:4px;margin:0 0 16px;background:#EFEBE1;border-radius:14px}
.seg button{flex:1;min-height:44px;padding:8px 6px;text-align:center;font-size:15px;font-weight:600;color:var(--mu);background:transparent;border:0;border-radius:11px;box-shadow:none}
.seg button.on{background:var(--card);color:var(--sage-d);box-shadow:0 1px 3px rgba(47,58,54,.12)}
.seg button span{display:block;margin:2px 0 0;font-size:12px;font-weight:500;opacity:.75}
.seg button{font-size:14px;line-height:1.3;padding:8px 2px;min-height:52px}
h1+.card .scope{margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--sage-d)}
.lvs{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:13.5px}
.lvs>div{display:grid;grid-template-columns:1fr auto 52px;gap:12px;padding:6px 8px;border-radius:8px;color:var(--mu)}
.lvs>div.on{background:var(--sage-s);color:var(--tx);font-weight:600}
.lvs>div span:nth-child(2),.lvs>div span:nth-child(3){text-align:right}
@media(min-width:700px){main{padding-top:48px}}
</style></head><body><main id="app"></main>

let AUTO=S.get('auto',true),RATE=S.get('rate',.8);const spk=()=>cur.key[0]==='g'?GR[+cur.key.slice(2)][0].replace('___',cur.ans):cur.key.split('|')[1];const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=RATE;speechSynthesis.speak(u)}catch(e){}};
function mk(key,retry){const [t,r]=key.split('|');
 if(t==='g'){const g=GR[+r];const T=GT[+r]||['',g[3]],a=g[1][g[2]];return{key,label:'文法',prompt:g[0],tr:T[0],opts:shuffle(g[1]),ans:a,exp:`完整句子:${g[0].replace('___',a)}\n中文翻譯:${T[0]}\n\n💡 ${T[1]}`,retry}}
 const w=words.find(x=>x.w===r);if(!w)return null;
 const o=()=>shuffle([w,...shuffle(pool().filter(x=>x!==w&&x.m!==w.m&&x.w!==w.w)).slice(0,3)]);
 const exp=`${w.w} = ${w.m}`;
 if(t==='listen')return{key,label:'聽力',prompt:'🔊 聽發音,選出正確的中文意思',say:w.w,opts:o().map(x=>x.m),ans:w.m,exp,retry};
 if(t==='read')return Math.random()<.5?{key,label:'閱讀',prompt:w.w,opts:o().map(x=>x.m),ans:w.m,exp,retry}:{key,label:'閱讀',prompt:`「${w.m}」的英文是?`,opts:o().map(x=>x.w),ans:w.w,exp,retry};
 const d=Math.random()<.5;return{key,label:d?'聽寫':'拼寫',prompt:d?'🔊 聽發音,拼出這個單字':`拼出「${w.m}」的英文`,say:d?w.w:null,write:1,hint:w.w[0]+' '+'_ '.repeat(w.w.length-1)+`(${w.w.length} 個字母)`,ans:w.w,exp,retry}}
const lbl=k=>{const[t,r]=k.split('|');if(t==='g')return GR[+r][0];const w=words.find(x=>x.w===r);return w?`${w.w} — ${w.m}`:r};
const TN={listen:'聽力',read:'閱讀',write:'寫作',g:'文法'};
const MODES={mix:'🎲 混合測驗(聽・讀・寫・文法)',listen:'👂 聽力',read:'📖 閱讀',write:'✍️ 寫作/聽寫',gram:'📐 基礎文法',wrong:'🔁 錯題加強'};
function home(){Q=null;const wk=Object.keys(wrong),sg=k=>stat[k]||{t:0,c:0},pc=k=>sg(k).t?Math.round(sg(k).c/sg(k).t*100):0,cs=sg(LV),acc=pc(LV);
 $('#app').innerHTML=`<h1>📚 英語小教室</h1><div class="card"><div class="scope">${LN[LV]}・學習紀錄</div><div class="row"><span>累計作答 <b>${cs.t}</b> 題</span><span>正確率 <b>${acc}%</b></span><span>單字庫 <b>${pool().length}</b></span></div><div class="bar" style="margin-top:8px"><i style="width:${acc}%"></i></div><div class="lvs">${Object.keys(LN).map(k=>`<div class="${k===LV?'on':''}"><span>${LN[k]}</span><span>${sg(k).t} 題</span><span>${sg(k).t?pc(k)+'%':'—'}</span></div>`).join('')}</div></div>
 <div class="seg">${[['1','初級'],['2','中級'],['3','高級'],['12','初/中級'],['all','全部']].map(([v,t])=>`<button data-a="lv" data-v="${v}" class="${LV===v?'on':''}">${t}<span>${v==='all'?words.length:v==='12'?words.filter(x=>x.lv==='1'||x.lv==='2').length:words.filter(x=>x.lv===v).length}</span></button>`).join('')}</div><button data-a="rate" style="margin:0 8px 8px 0">🐢 語速:${Math.round(RATE*100)}%</button><button data-a="auto" style="margin-bottom:8px">${AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}</button><div class="grid">${Object.entries(MODES).map(([k,v])=>`<button data-a="start" data-m="${k}" ${k==='wrong'?'style="grid-column:1/3"':''}>${v}${k==='wrong'?`<span class="mu"> ・目前 ${wk.length} 題</span>`:''}</button>`).join('')}</div>
 <p class="mu">答錯的題目會在本回合稍後再次出現;錯題在「錯題加強」中連續答對 2 次才會移出錯題本。</p>
 <div class="card"><details><summary>📐 基礎文法重點</summary>${LES2}</details>
 <details><summary>📝 錯題本(${wk.length})</summary>${wk.length?wk.map(k=>`<div class="row" style="border-bottom:1px solid var(--bd);padding:6px 0"><span>${k[0]==='g'?'':`<button data-a="sayw" data-w="${esc(k.split('|')[1])}" style="padding:2px 8px">🔊</button> `}${esc(lbl(k))}</span><span class="mu">錯 ${wrong[k].n} 次</span></div>`).join('')+'<button data-a="clear" style="margin-top:8px">清空錯題本</button>':'<p class="mu">目前沒有錯題 🎉</p>'}</details>
 <details><summary>⚙️ 匯入完整單字表</summary><p class="mu">貼上單字表(支援「編號/單字/中文」逐行格式,或每行「單字|中文」),即可用全部單字練習。</p><textarea id="imp" rows="6"></textarea><div class="grid" style="margin-top:8px"><button class="p" data-a="imp">匯入</button><button data-a="reset">還原內建</button></div><p id="impmsg" class="mu"></p></details><details><summary>🗑 清空紀錄</summary><p class="mu">「清空目前級別」只會清除上方所選級別的作答次數和正確率。「清空全部」會同時清除所有級別紀錄和錯題本。</p><div class="grid"><button data-a="clearstat">清空目前級別</button><button data-a="clearall">清空全部</button></div></details></div>`}
function start(m){let keys=[];const W=()=>shuffle(pool()).slice(0,10).map(w=>w.w);
 if(m==='mix')for(let i=0;i<10;i++){const t=['listen','read','write','g'][Math.random()*4|0];keys.push(t==='g'?'g|'+(Math.random()*GR.length|0):t+'|'+pool()[Math.random()*pool().length|0].w)}
 else if(m==='gram')keys=shuffle(GR.map((_,i)=>'g|'+i)).slice(0,10);
 else if(m==='wrong'){keys=shuffle(Object.keys(wrong)).slice(0,10);if(!keys.length){alert('目前沒有錯題,先去做測驗吧!');return}}
 else keys=W().map(w=>m+'|'+w);
 Q={q:keys,total:keys.length,right:0,miss:[],m};next()}
function next(){if(!Q.q.length)return done();cur=mk(Q.q.shift());if(!cur)return next();if(!cur.say&&cur.prompt===cur.key.split('|')[1])cur.say=cur.prompt;answered=false;
 const n=Q.total-Q.q.length;
 $('#app').innerHTML=`<div class="row"><button data-a="home">← 返回</button><span class="mu">第 ${Math.min(n,Q.total)} / ${Q.total} 題・剩 ${Q.q.length+1}</span></div><div class="bar" style="margin:10px 0"><i style="width:${(Q.total-Q.q.length-1)/Q.total*100}%"></i></div>
 <div class="card"><span class="tag">${cur.label}</span>${cur.retry?' <span class="tag">重做</span>':''}<div class="q">${esc(cur.prompt)}</div>${cur.tr?`<p class="mu">💡 中文:${esc(cur.tr)}</p>`:''}${cur.say?'<button data-a="say">🔊 再聽一次</button>':''}
 ${cur.write?`<p class="mu">提示:${esc(cur.hint)}</p><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文"><button class="p opt" data-a="submit">送出</button>`:cur.opts.map(o=>`<div style="display:flex;gap:6px;margin-top:8px"><button class="opt" style="margin:0;flex:1" data-a="opt" data-v="${esc(o)}">${esc(o)}</button>${/^[A-Za-z]/.test(o)?`<button data-a="sayv" data-v="${esc(o)}" title="聽發音">🔊</button>`:''}</div>`).join('')}<div id="fb"></div></div>`;
 if(cur.say&&(AUTO||cur.key[0]==='l'||cur.write))say(cur.say);const a=$('#ans');if(a)a.focus()}
function answer(v){if(answered)return;answered=true;const ok=v.trim().toLowerCase()===cur.ans.toLowerCase();
 if(!cur.retry){const s=stat[LV]=stat[LV]||{t:0,c:0};s.t++;if(ok){s.c++;Q.right++}else Q.miss.push(cur.key)}
 const w=wrong[cur.key];
 if(ok&&w){w.s=(w.s||0)+1;if(w.s>=2)delete wrong[cur.key]}
 if(!ok){wrong[cur.key]={n:(w?w.n:0)+1,s:0};if(!cur.retry||(cur.tries||0)<2){Q.q.splice(Math.min(2,Q.q.length),0,cur.key)}}
 save();
 document.querySelectorAll('.opt[data-v]').forEach(b=>{b.disabled=true;if(b.dataset.v===cur.ans)b.classList.add('ok');else if(b.dataset.v===v)b.classList.add('ng')});
 const a=$('#ans');if(a){a.disabled=true;a.classList.add(ok?'ok':'ng')}
 $('#fb').innerHTML=`<p style="color:var(${ok?'--ok':'--ng'})"><b>${ok?'✅ 答對了!':'❌ 答錯了,正確答案:'+esc(cur.ans)}</b></p><p class="mu" style="white-space:pre-line">${esc(cur.exp)}</p><button data-a="say2">🔊 ${cur.key[0]==='g'?'聽完整句子':'聽單字發音'}</button> <button class="p" data-a="next" style="width:100%;margin-top:8px">${Q.q.length?'下一題 →':'完成'}</button>`;
 if(AUTO)say(spk())}
function done(){const p=Math.round(Q.right/Q.total*100),ms=[...new Set(Q.miss)];
 $('#app').innerHTML=`<h1>🎉 完成!</h1><div class="card"><div class="q">${Q.right} / ${Q.total}(${p}%)</div><p>${p>=90?'太棒了!':p>=60?'不錯喔,繼續加油!':'多練習幾次就會進步!'}</p>${ms.length?'<b>需要加強:</b>'+ms.map(k=>`<div class="mu">• ${esc(lbl(k))}</div>`).join(''):''}</div>
 <div class="grid"><button class="p" data-a="start" data-m="${Q.m}">再來一回</button><button data-a="start" data-m="wrong">🔁 錯題加強</button><button data-a="home" style="grid-column:1/3;text-align:center">回首頁</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='start')start(b.dataset.m);else if(a==='opt')answer(b.dataset.v);else if(a==='submit')answer($('#ans').value);
 else if(a==='next')next();else if(a==='home')home();else if(a==='say')say(cur.say);else if(a==='say2')say(spk());else if(a==='sayv')say(b.dataset.v);else if(a==='sayw')say(b.dataset.w);else if(a==='clearstat'){if(confirm('確定清空「'+LN[LV]+'」的作答紀錄?')){delete stat[LV];save();home()}}else if(a==='clearall'){if(confirm('確定清空所有級別的作答紀錄與錯題本?此動作無法復原。')){stat={};wrong={};save();home()}}else if(a==='lv'){LV=b.dataset.v;S.set('lv',LV);home()}else if(a==='rate'){RATE=RATE<.7?.8:RATE<.9?1:.6;S.set('rate',RATE);b.textContent='🐢 語速:'+Math.round(RATE*100)+'%';say('Hello, nice to meet you')}else if(a==='auto'){AUTO=!AUTO;S.set('auto',AUTO);b.textContent=AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}
 else if(a==='clear'){if(confirm('確定清空錯題本?')){wrong={};save();home()}}
 else if(a==='imp'){const r=parse($('#imp').value);if(r.length<10){$('#impmsg').textContent='解析失敗或單字少於 10 個,請檢查格式。';return}const L=LV==='2'||LV==='3'?LV:'1';r.forEach(x=>x.lv=L);words=words.filter(x=>x.lv!==L).concat(r);S.set('words',words);wrong={};save();home()}
 else if(a==='reset'){words=DEF();try{localStorage.removeItem('words')}catch(e){}wrong={};save();home()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!Q||!cur)return;if(answered)next();else if(cur.write)answer($('#ans').value)});
home();
</script></body></html>
