<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>小小英語樂園</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap");
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#FFF8EC;--ink:#4A3F35;--mu:#7C6F62;--line:#F1E3CB;--pr:#2F9A78;--prd:#1F7A5C;--sun:#FFD66B;--sky:#CFEAF8;--pink:#FFD3DC;--mint:#D3F0E0;--peach:#FFE3BF}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 20px/1.6 "Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:20px 16px 56px;overflow-wrap:anywhere}
h1{margin:4px 0 0;font-size:34px;font-weight:900;line-height:1.2}.sub{margin:2px 0 16px;color:var(--mu);font-size:17px}
.card{background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px;margin:0 0 18px;box-shadow:0 5px 0 var(--line);animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .12s}
button:active:not(:disabled){transform:translateY(3px)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid rgba(47,154,120,.4);outline-offset:2px}
.scope{font-size:18px;font-weight:900;color:var(--prd);margin-bottom:8px}
.row3{display:flex;text-align:center}.row3>div{flex:1}.row3 i{display:block;font-style:normal;font-size:15px;color:var(--mu)}.row3 b{font-size:34px;font-weight:900;line-height:1.2}.row3 small{font-size:16px;margin-left:2px}.row3 .hi b{font-size:50px;color:var(--pr)}
.bar{height:16px;border-radius:99px;background:#F6ECD8;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--pr);border-radius:99px;transition:width .5s}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:4px 16px 10px;scroll-snap-type:x proximity}
.chip{flex:none;scroll-snap-align:start;min-height:52px;padding:8px 18px;font-size:19px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:99px}
.chip.on{background:var(--sun);border-color:#F2B93B}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.m{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;padding:14px;font-size:23px;font-weight:900;border:3px solid rgba(74,63,53,.18);border-radius:28px;box-shadow:0 5px 0 rgba(74,63,53,.15)}
.m .ic{font-size:46px;line-height:1.1}.m small{font-size:16px;font-weight:700;color:var(--mu)}
.m-mix{background:var(--peach)}.m-listen{background:var(--sky)}.m-read{background:var(--mint)}.m-write{background:var(--pink)}.m-wrong{grid-column:1/-1;background:#FFF3C4;min-height:84px;flex-direction:row;gap:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{min-height:52px;padding:8px 18px;font-size:17px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:99px}
.plain{padding:6px 18px}details{border-top:2px solid var(--line)}details:first-child{border:0}summary{min-height:56px;display:flex;align-items:center;font-size:19px;font-weight:800;cursor:pointer}
.wr{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:18px}.wr span{margin-left:auto;color:var(--mu);font-size:15px}
.credit{margin:8px 4px 0;color:var(--mu);font-size:14px;font-weight:500;line-height:1.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.back{min-height:52px;padding:8px 16px;font-size:18px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:99px}.cnt{color:var(--mu);font-size:17px}
.tag{display:inline-block;padding:2px 16px;background:var(--mint);border-radius:99px;font-size:16px;font-weight:900;color:var(--prd)}
.pic{margin-top:8px;text-align:center;font-size:96px;line-height:1.15}
.q{margin:8px 0 12px;text-align:center;font-size:40px;font-weight:900;line-height:1.3}
.hint{text-align:center;color:var(--mu);font-size:22px;letter-spacing:.08em;margin:0 0 8px}
.orow{display:flex;gap:10px;margin-top:12px}
.opt{flex:1;min-height:80px;padding:12px 16px;font-size:27px;font-weight:800;line-height:1.3;background:#fff;border:3px solid var(--line);border-radius:24px;box-shadow:0 4px 0 var(--line)}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.ok,input.ok{background:var(--mint);border-color:var(--pr)!important}.opt.ng,input.ng{background:#FFE6E1;border-color:#E88F80!important}
.opt.ok::after{content:" ✓";color:var(--pr)}.opt.ng::after{content:" ✕";color:#C9604E}
.spk,.sp{min-width:68px;min-height:64px;padding:6px 14px;font-size:26px;background:var(--sky);border:3px solid #A9D3EA;border-radius:24px}.sp{display:block;margin:6px auto 4px;font-size:20px;font-weight:800;padding:8px 22px;border-radius:99px;min-height:56px}
.p{display:block;width:100%;min-height:72px;margin-top:14px;font-size:26px;font-weight:900;color:#fff;background:var(--pr);border:3px solid var(--prd);border-radius:24px;box-shadow:0 5px 0 var(--prd)}
.p:active:not(:disabled){box-shadow:0 2px 0 var(--prd)}
#ans{width:100%;box-sizing:border-box;padding:14px;font:inherit;font-size:34px;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:24px;background:#fff;color:var(--ink)}
#fb{margin-top:16px;padding-top:12px;border-top:3px dashed var(--line);text-align:center}.res{font-size:28px;font-weight:900}.res.g{color:var(--pr)}.res.b{color:#C9604E}
.exp{font-size:34px;font-weight:900;margin:4px 0}.exp small{display:block;font-size:26px;color:var(--mu)}
.stars{font-size:56px;text-align:center}.c{text-align:center}
@media(max-width:380px){h1{font-size:30px}.q{font-size:34px}.opt{font-size:23px}.pic{font-size:80px}.m{font-size:20px}}
</style></head><body><main id="app"></main>
<script>
const D="#動物自然|🐶;cat|貓|🐱;dog|狗|🐶;bird|鳥|🐦;fish|魚|🐟;duck|鴨|🦆;pig|豬|🐷;cow|牛|🐄;horse|馬|🐴;sheep|羊|🐑;bear|熊|🐻;lion|獅子|🦁;tiger|老虎|🐯;elephant|大象|🐘;monkey|猴子|🐵;rabbit|兔子|🐰;frog|青蛙|🐸;turtle|烏龜|🐢;ant|螞蟻|🐜;bee|蜜蜂|🐝;butterfly|蝴蝶|🦋;sun|太陽|☀️;moon|月亮|🌙;star|星星|⭐;sky|天空|🌤️;cloud|雲|☁️;rain|雨|🌧️;snow|雪|❄️;wind|風|💨;tree|樹|🌳;flower|花|🌸;grass|草|🌱;river|河流|🏞️;sea|海洋|🌊;mountain|山|⛰️;rock|石頭|🪨;#家庭人物|👨‍👩‍👧;family|家庭|👨‍👩‍👧;father|爸爸|👨;mother|媽媽|👩;brother|兄弟|👬;sister|姊妹|👭;baby|嬰兒|👶;grandfather|爺爺/外公|👴;grandmother|奶奶/外婆|👵;uncle|叔伯舅|🧔;aunt|姑姨嬸|👩;boy|男孩|👦;girl|女孩|👧;man|男人|👨;woman|女人|👩;child|兒童|🧒;friend|朋友|🤝;teacher|老師|👩‍🏫;student|學生|🧑‍🎓;doctor|醫生|🧑‍⚕️;nurse|護士|👩‍⚕️;police officer|警察|👮;farmer|農夫|🧑‍🌾;driver|司機|🚗;cook|廚師|👨‍🍳;king|國王|🤴;queen|女王|👸;head|頭|🙂;eye|眼睛|👀;ear|耳朵|👂;nose|鼻子|👃;mouth|嘴巴|👄;#食物飲料|🍎;food|食物|🍽️;water|水|💧;milk|牛奶|🥛;juice|果汁|🧃;tea|茶|🍵;bread|麵包|🍞;rice|米飯|🍚;noodle|麵條|🍜;egg|雞蛋|🥚;meat|肉|🥩;chicken|雞肉|🍗;soup|湯|🍲;cake|蛋糕|🍰;cookie|餅乾|🍪;candy|糖果|🍬;ice cream|冰淇淋|🍦;apple|蘋果|🍎;banana|香蕉|🍌;orange|橘子|🍊;grape|葡萄|🍇;lemon|檸檬|🍋;strawberry|草莓|🍓;watermelon|西瓜|🍉;tomato|番茄|🍅;potato|馬鈴薯|🥔;carrot|蘿蔔|🥕;corn|玉米|🌽;breakfast|早餐|🍳;lunch|午餐|🍱;dinner|晚餐|🍽️;plate|盤子|🍽️;bowl|碗|🥣;cup|杯子|🥤;spoon|湯匙|🥄;#身體衣物|👕;face|臉|😀;hair|頭髮|💇;tooth|牙齒|🦷;neck|脖子|;shoulder|肩膀|;arm|手臂|💪;hand|手|✋;finger|手指|☝️;leg|腿|🦵;foot|腳|🦶;toe|腳趾|;body|身體|🧍;clothes|衣服|👚;shirt|襯衫|👕;T-shirt|T恤|👕;pants|長褲|👖;shorts|短褲|🩳;skirt|短裙|;dress|連身裙|👗;coat|大衣|🧥;jacket|外套|🧥;shoes|鞋子|👟;socks|襪子|🧦;hat|帽子|👒;cap|棒球帽|🧢;glasses|眼鏡|👓;bag|包包|👜;umbrella|雨傘|☂️;#居家學校|🏠;house|房屋|🏠;home|家|🏡;room|房間|;door|門|🚪;window|窗戶|🪟;bed|床|🛏️;table|桌子|;chair|椅子|🪑;desk|書桌|;sofa|沙發|🛋️;TV|電視|📺;clock|時鐘|🕰️;telephone|電話|☎️;light|燈|💡;key|鑰匙|🔑;school|學校|🏫;classroom|教室|;book|書本|📖;pen|原子筆|🖊️;pencil|鉛筆|✏️;eraser|橡皮擦|;ruler|直尺|📏;paper|紙|📄;backpack|書包|🎒;computer|電腦|💻;picture|圖畫|🖼️;music|音樂|🎵;game|遊戲|🎮;toy|玩具|🧸;ball|球|⚽;doll|洋娃娃|🪆;kite|風箏|🪁;bike|自行車|🚲;car|汽車|🚗;#場所交通|🚌;park|公園|🌳;zoo|動物園|🦁;shop|商店|🏪;market|市場|🛒;hospital|醫院|🏥;bank|銀行|🏦;farm|農場|🚜;street|街道|🛣️;road|道路|🛤️;bus|公車|🚌;train|火車|🚆;plane|飛機|✈️;boat|小船|⛵;ship|大船|🚢;truck|卡車|🚚;taxi|計程車|🚕;up|向上|⬆️;down|向下|⬇️;in|在…裡|;on|在…上|;under|在…下|;left|左|⬅️;right|右|➡️;front|前|;back|後|;#顏色數字|🎨;color|顏色|🎨;red|紅色|🔴;blue|藍色|🔵;yellow|黃色|🟡;green|綠色|🟢;orange|橘色|🟠;pink|粉紅色|🌸;purple|紫色|🟣;black|黑色|⚫;white|白色|⚪;brown|棕色|🟤;circle|圓形|⭕;square|正方形|🟦;triangle|三角形|🔺;heart|心形|❤️;big|大|🐘;small|小|🐜;long|長|🐍;short|短/矮|;tall|高|🦒;one|一|1;two|二|2;three|三|3;four|四|4;five|五|5;six|六|6;seven|七|7;eight|八|8;nine|九|9;ten|十|10;first|第一|🥇;last|最後|🏁;#常用動詞|🏃;go|去|➡️;come|來|👋;see|看見|👁️;look|看(注視)|👀;listen|聽|👂;eat|吃|🍴;drink|喝|🥤;sleep|睡覺|😴;wake|醒來|⏰;walk|走路|🚶;run|跑步|🏃;jump|跳|🤸;fly|飛|🕊️;swim|游泳|🏊;play|玩|🎲;sing|唱歌|🎤;dance|跳舞|💃;read|閱讀|📖;write|寫|✍️;draw|畫畫|🖍️;wash|洗|🧼;open|打開|📂;close|關閉|🚪;stop|停止|🛑;help|幫助|🆘;give|給|🎁;take|拿/取|🤏;make|做|🛠️;sit|坐|🪑;stand|站|🧍;smile|微笑|😊;cry|哭泣|😭;like|喜歡|👍;love|愛|❤️;want|想要|🙏;know|知道|💡;think|想/認為|🤔;#形容詞|😊;good|好的|👍;bad|壞的|👎;new|新的|🆕;old|舊的/老的|🕰️;happy|快樂的|😄;sad|悲傷的|😢;angry|生氣的|😠;tired|累的|🥱;hungry|餓的|😋;thirsty|口渴的|🥵;hot|熱的|🔥;cold|冷的|🥶;warm|溫暖的|🧣;cool|涼爽的|😎;clean|乾淨的|✨;dirty|髒的|🐷;fast|快的|🐇;slow|慢的|🐌;easy|簡單的|👌;hard|困難的/堅硬的|🪨;quiet|安靜的|🤫;loud|大聲的|📢;nice|漂亮的|💖;beautiful|美麗的|🌺;cute|可愛的|🐣;day|白天|🌞;night|夜晚|🌙;morning|早上|🌅;afternoon|下午|☀️;evening|晚上|🌇;today|今天|📅;tomorrow|明天|📆;yesterday|昨天|⏪;now|現在|⏰;#代名詞問候|👋;I|我|🙋;you|你/你們|👉;he|他|👦;she|她|👧;it|它/牠|🐾;we|我們|👫;they|他們|👥;this|這個|👇;that|那個|👉;my|我的|;your|你的|;hello|你好|👋;goodbye|再見|🖐️;please|請|🙏;thank you|謝謝|💐;sorry|對不起|😔;excuse me|不好意思/抱歉|🙇;yes|是|✅;no|否|❌;welcome|歡迎|🤗;what|什麼|❓;who|誰|🧑;where|哪裡|📍;when|何時|🕒;why|為什麼|🤔;how|如何|🛠️";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const words=[],cats=[];
D.split(';').forEach(s=>{const p=s.split('|');if(s[0]==='#')cats.push({n:p[0].slice(1),e:p[1]});else words.push({w:p[0],m:p[1],e:p[2]||'',c:cats.length-1,i:words.length})});
let wrong=S.get('k_wrong',{}),stat=S.get('k_stat',{}),CAT=S.get('k_cat','a'),RATE=S.get('k_rate',.7),AUTO=S.get('k_auto',true),Q=null,cur=null,answered=false;
const save=()=>{S.set('k_wrong',wrong);S.set('k_stat',stat)};
if(S.get('k_ver',0)<2){for(const k in wrong)if(!k.startsWith('ph|'))delete wrong[k];for(const k in stat)if(k!=='ph')delete stat[k];CAT='a';S.set('k_cat','a');S.set('k_ver',2);save()}
if(CAT!=='a'&&!cats[CAT])CAT='a';
for(const k in wrong)if(k.startsWith('ph|'))delete wrong[k];delete stat.ph;
const pool=()=>{const p=CAT==='a'?words:words.filter(x=>x.c===+CAT);return p.length>=4?p:words};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=RATE;speechSynthesis.speak(u)}catch(e){}};

const MODES=[['mix','🎲','混合測驗'],['listen','👂','聽力'],['read','👀','閱讀'],['write','✍️','寫作/聽寫']];
function home(){Q=null;const s=stat[CAT]||{t:0,c:0},acc=s.t?Math.round(s.c/s.t*100):0,wk=Object.keys(wrong);
 const sc=CAT==='a'?'🌈 全部單字':cats[CAT].e+' '+cats[CAT].n;
 $('#app').innerHTML=`<h1>🐣 小小英語樂園</h1><p class="sub">幼兒基礎單字</p>
<div class="card"><div class="scope">${sc}</div><div class="row3"><div><i>累計作答</i><b>${s.t}<small>題</small></b></div><div class="hi"><i>正確率</i><b>${acc}%</b></div><div><i>單字數</i><b>${pool().length}<small>字</small></b></div></div><div class="bar"><i style="width:${acc}%"></i></div></div>
<div class="chips">${[['a','🌈','全部']].concat(cats.map((c,i)=>[String(i),c.e,c.n])).map(([v,e,n])=>`<button class="chip ${v===String(CAT)?'on':''}" data-a="cat" data-v="${v}">${e} ${n}</button>`).join('')}</div>
<div class="grid">${MODES.map(([k,e,n])=>`<button class="m m-${k}" data-a="start" data-m="${k}"><span class="ic">${e}</span>${n}</button>`).join('')}<button class="m m-wrong" data-a="start" data-m="wrong"><span class="ic">🔁</span>錯題加強<small>${wk.length} 題</small></button></div>
<div class="tools"><button class="pill" data-a="rate">🐢 語速:${Math.round(RATE*100)}%</button><button class="pill" data-a="auto">${AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}</button></div>
<div class="card plain"><details><summary>📝 錯題本(${wk.length})</summary>${wk.length?wk.map(k=>`<div class="wr"><button class="spk" style="min-width:52px;min-height:48px;font-size:20px" data-a="sayw" data-w="${esc(words[+k.split('|')[1]].w)}">🔊</button>${esc(lbl(k))}<span>錯 ${wrong[k].n} 次</span></div>`).join(''):'<p>目前沒有錯題 🎉</p>'}</details>
<details><summary>🗑 清空紀錄</summary><p style="font-size:17px;font-weight:500">「清空目前分類」只清除上方所選分類的作答紀錄;「清空全部」會連同錯題本一起清除。</p><div class="tools"><button class="pill" data-a="clearcat">清空目前分類</button><button class="pill" data-a="clearall">清空全部</button></div></details></div>
`}
function start(m){const P=pool();let keys=[];
 if(m==='wrong'){keys=shuffle(Object.keys(wrong)).slice(0,10);if(!keys.length){alert('目前沒有錯題,太棒了!');return}}
 else{const T=['listen','read','write'];keys=shuffle(P).slice(0,10).map(w=>(m==='mix'?T[Math.random()*3|0]:m)+'|'+w.i);
  const ex=shuffle(Object.keys(wrong)).filter(k=>!keys.some(x=>x.split('|')[1]===k.split('|')[1])&&(m==='mix'||k.startsWith(m+'|'))).slice(0,3);
  keys=shuffle([...keys.slice(0,keys.length-ex.length),...ex])}
 Q={q:keys,total:keys.length,done:0,right:0,miss:[],m};next()}
function mk(key){const[t,r]=key.split('|'),w=words[+r];if(!w)return null;
 const o3=()=>shuffle([w,...shuffle(pool().filter(x=>x!==w&&x.m!==w.m&&x.w!==w.w)).slice(0,2)]);
 const b={key,w,e:w.e};
 if(t==='listen')return{...b,e:'',label:'👂 聽力',prompt:'聽一聽,選出正確的意思',say:w.w,opts:o3().map(x=>({t:(x.e?x.e+' ':'')+x.m,v:x.m})),ans:w.m};
 if(t==='read')return Math.random()<.5?{...b,label:'👀 閱讀',prompt:w.w,say:w.w,opts:o3().map(x=>({t:x.m,v:x.m})),ans:w.m}:{...b,label:'👀 閱讀',prompt:w.m,opts:o3().map(x=>({t:x.w,v:x.w})),ans:w.w};
 const d=Math.random()<.5;return{...b,e:d?'':w.e,label:d?'✍️ 聽寫':'✍️ 拼寫',prompt:d?'聽一聽,把單字寫出來':w.m,say:d?w.w:null,write:1,alt:!d,hint:w.w.split('').map((c,i)=>c===' '?'\u00a0':i?'_':c).join(' '),ans:w.w}}
function next(){if(!Q.q.length)return done();cur=mk(Q.q.shift());if(!cur)return next();answered=false;const n=Math.min(Q.done+1,Q.total);
 $('#app').innerHTML=`<div class="top"><button class="back" data-a="home">← 回首頁</button><span class="cnt">第 ${n} / ${Q.total} 題</span></div><div class="bar" style="margin:0 0 14px"><i style="width:${Q.done/Q.total*100}%"></i></div>
<div class="card"><span class="tag">${cur.label}</span>${cur.e?`<div class="pic">${cur.e}</div>`:''}<div class="q">${esc(cur.prompt)}</div>${cur.say?'<button class="sp" data-a="say">🔊 再聽一次</button>':''}
${cur.write?`<p class="hint">${esc(cur.hint)}</p><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文"><button class="p" data-a="submit">送出</button>`:cur.opts.map(o=>`<div class="orow"><button class="opt" data-a="opt" data-v="${esc(o.v)}">${esc(o.t)}</button>${/^[A-Za-z]/.test(o.v)?`<button class="spk" data-a="sayv" data-v="${esc(o.v)}">🔊</button>`:''}</div>`).join('')}<div id="fb"></div></div>`;
 if(cur.say&&(AUTO||cur.key[0]==='l'||cur.write))say(cur.say);const a=$('#ans');if(a)a.focus()}
function answer(v){if(answered)return;answered=true;const n=s=>s.trim().toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ');
 const ok=cur.write?(n(v)===n(cur.ans)||(cur.alt&&words.some(x=>x.m===cur.w.m&&n(x.w)===n(v)))):v===cur.ans;
 const s=stat[CAT]=stat[CAT]||{t:0,c:0};s.t++;Q.done++;if(ok){s.c++;Q.right++}else Q.miss.push(cur.key);
 const w=wrong[cur.key];if(ok&&w){w.s=(w.s||0)+1;if(w.s>=2)delete wrong[cur.key]}if(!ok)wrong[cur.key]={n:(w?w.n:0)+1,s:0};save();
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===cur.ans)b.classList.add('ok');else if(b.dataset.v===v)b.classList.add('ng')});
 const a=$('#ans');if(a){a.disabled=true;a.classList.add(ok?'ok':'ng')}
 $('#fb').innerHTML=`<div class="res ${ok?'g':'b'}">${ok?'🎉 答對了!好棒!':'😊 沒關係!答案是:'}</div><div class="exp">${cur.w.e} ${esc(cur.w.w)}<small>${esc(cur.w.m)}</small></div><button class="sp" data-a="say2">🔊 聽發音</button><button class="p" data-a="next">${Q.q.length?'下一題 →':'看結果 🎁'}</button>`;
 if(AUTO)say(cur.w.w)}
function done(){const p=Math.round(Q.right/Q.total*100),st=p>=90?3:p>=60?2:1,ms=[...new Set(Q.miss)];
 $('#app').innerHTML=`<h1>🎉 完成啦!</h1><div class="card c"><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="q">${Q.right} / ${Q.total}</div><p>${p>=90?'太厲害了!':p>=60?'做得很好,繼續加油!':'多練習幾次就會進步喔!'}</p>${ms.length?'<p style="margin:0">這幾個下次再練習:</p>'+ms.map(k=>`<div style="font-size:20px">${esc(lbl(k))}</div>`).join(''):''}</div>
<button class="p" data-a="start" data-m="${Q.m}">再玩一次 🎈</button><button class="p" style="background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)" data-a="home">回首頁</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='start')start(b.dataset.m);else if(a==='opt')answer(b.dataset.v);else if(a==='submit')answer($('#ans').value);else if(a==='next')next();else if(a==='home')home();
 else if(a==='say')say(cur.say);else if(a==='say2')say(cur.w.w);else if(a==='sayv')say(b.dataset.v);else if(a==='sayw')say(b.dataset.w);
 else if(a==='cat'){CAT=b.dataset.v;S.set('k_cat',CAT);home()}
 else if(a==='rate'){RATE=RATE<.6?.7:RATE<.8?.9:.5;S.set('k_rate',RATE);b.textContent='🐢 語速:'+Math.round(RATE*100)+'%';say('Hello, nice to meet you')}
 else if(a==='auto'){AUTO=!AUTO;S.set('k_auto',AUTO);b.textContent=AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}
 else if(a==='clearcat'){if(confirm('確定清空這個分類的作答紀錄?')){delete stat[CAT];save();home()}}
 else if(a==='clearall'){if(confirm('確定清空所有作答紀錄與錯題本?無法復原。')){stat={};wrong={};save();home()}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!Q||!cur)return;if(answered)next();else if(cur.write)answer($('#ans').value)});
home();
</script></body></html>
