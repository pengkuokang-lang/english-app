 return snd?{...b,e:'',prompt:'聽一聽,這是哪個字母的聲音?',snd:L.l}:{...b,e:L.e,prompt:L.w,say:L.w,sub:'這個字是從哪個字母開頭的?'}}

<div class="tools"><button class="pill" data-a="rate">🐢 語速:${Math.round(RATE*100)}%</button><button class="pill" data-a="auto">${AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}</button></div>
<div class="card plain"><details><summary>📝 錯題本(${wk.length})</summary>${wk.length?wk.map(k=>`<div class="wr"><button class="spk" style="min-width:52px;min-height:48px;font-size:20px" ${k.startsWith('ph|')?`data-a="phs" data-l="${LET[+k.slice(3)].l}"`:`data-a="sayw" data-w="${esc(words[+k.split('|')[1]].w)}"`}>🔊</button>${esc(lbl(k))}<span>錯 ${wrong[k].n} 次</span></div>`).join(''):'<p>目前沒有錯題 🎉</p>'}</details>
<details><summary>🗑 清空紀錄</summary><p style="font-size:17px;font-weight:500">「清空目前分類」只清除上方所選分類的作答紀錄;「清空全部」會連同錯題本一起清除。</p><div class="tools"><button class="pill" data-a="clearcat">清空目前分類</button><button class="pill" data-a="clearall">清空全部</button></div></details></div>
`}
function start(m){const P=pool();let keys=[];
 if(m==='wrong'){keys=shuffle(Object.keys(wrong)).slice(0,10);if(!keys.length){alert('目前沒有錯題,太棒了!');return}}
 else{const T=['listen','read','write'];const ph=m==='ph';keys=(ph?shuffle(LET):shuffle(P)).slice(0,10).map(w=>(ph?'ph':m==='mix'?T[Math.random()*3|0]:m)+'|'+w.i);
  const ex=shuffle(Object.keys(wrong)).filter(k=>!keys.some(x=>x.split('|')[1]===k.split('|')[1])&&(ph?k.startsWith('ph|'):k[0]!=='p'&&(m==='mix'||k.startsWith(m+'|')))).slice(0,3);
  keys=shuffle([...keys.slice(0,keys.length-ex.length),...ex])}
 Q={q:keys,total:keys.length,done:0,right:0,miss:[],m};next()}
function mk(key){const[t,r]=key.split('|'),w=words[+r];if(t==='ph')return mkph(+r,key);if(!w)return null;
 const o3=()=>shuffle([w,...shuffle(pool().filter(x=>x!==w&&x.m!==w.m&&x.w!==w.w)).slice(0,2)]);
 const b={key,w,e:w.e};
 if(t==='listen')return{...b,e:'',label:'👂 聽力',prompt:'聽一聽,選出正確的意思',say:w.w,opts:o3().map(x=>({t:(x.e?x.e+' ':'')+x.m,v:x.m})),ans:w.m};
 if(t==='read')return Math.random()<.5?{...b,label:'👀 閱讀',prompt:w.w,say:w.w,opts:o3().map(x=>({t:x.m,v:x.m})),ans:w.m}:{...b,label:'👀 閱讀',prompt:w.m,opts:o3().map(x=>({t:x.w,v:x.w})),ans:w.w};
 const d=Math.random()<.5;return{...b,e:d?'':w.e,label:d?'✍️ 聽寫':'✍️ 拼寫',prompt:d?'聽一聽,把單字寫出來':w.m,say:d?w.w:null,write:1,alt:!d,hint:w.w.split('').map((c,i)=>c===' '?'\u00a0':i?'_':c).join(' '),ans:w.w}}
function next(){if(!Q.q.length)return done();cur=mk(Q.q.shift());if(!cur)return next();answered=false;const n=Math.min(Q.done+1,Q.total);
 $('#app').innerHTML=`<div class="top"><button class="back" data-a="home">← 回首頁</button><span class="cnt">第 ${n} / ${Q.total} 題</span></div><div class="bar" style="margin:0 0 14px"><i style="width:${Q.done/Q.total*100}%"></i></div>
<div class="card"><span class="tag">${cur.label}</span>${cur.e?`<div class="pic">${cur.e}</div>`:''}<div class="q">${esc(cur.prompt)}</div>${cur.sub?`<p class="hint" style="letter-spacing:0">${cur.sub}</p>`:''}${cur.say||cur.snd?'<button class="sp" data-a="say">🔊 再聽一次</button>':''}
${cur.write?`<p class="hint">${esc(cur.hint)}</p><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文"><button class="p" data-a="submit">送出</button>`:cur.opts.map(o=>`<div class="orow"><button class="opt" data-a="opt" data-v="${esc(o.v)}">${esc(o.t)}</button>${!cur.L&&/^[A-Za-z]/.test(o.v)?`<button class="spk" data-a="sayv" data-v="${esc(o.v)}">🔊</button>`:''}</div>`).join('')}<div id="fb"></div></div>`;
 if(cur.snd)playL(cur.snd);else if(cur.say&&(AUTO||cur.key[0]==='l'||cur.write))say(cur.say);const a=$('#ans');if(a)a.focus()}
function answer(v){if(answered)return;answered=true;const n=s=>s.trim().toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ');
 const ok=cur.write?(n(v)===n(cur.ans)||(cur.alt&&words.some(x=>x.m===cur.w.m&&n(x.w)===n(v)))):v===cur.ans;
 const sk=cur.L?'ph':CAT,s=stat[sk]=stat[sk]||{t:0,c:0};s.t++;Q.done++;if(ok){s.c++;Q.right++}else Q.miss.push(cur.key);
 const w=wrong[cur.key];if(ok&&w){w.s=(w.s||0)+1;if(w.s>=2)delete wrong[cur.key]}if(!ok)wrong[cur.key]={n:(w?w.n:0)+1,s:0};save();
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===cur.ans)b.classList.add('ok');else if(b.dataset.v===v)b.classList.add('ng')});
 const a=$('#ans');if(a){a.disabled=true;a.classList.add(ok?'ok':'ng')}
 $('#fb').innerHTML=`<div class="res ${ok?'g':'b'}">${ok?'🎉 答對了!好棒!':'😊 沒關係!答案是:'}</div><div class="exp">${cur.w.e} ${esc(cur.w.w)}<small>${esc(cur.w.m)}</small></div><button class="sp" data-a="say2">🔊 聽發音</button><button class="p" data-a="next">${Q.q.length?'下一題 →':'看結果 🎁'}</button>`;
 if(AUTO)speakAns()}
function done(){const p=Math.round(Q.right/Q.total*100),st=p>=90?3:p>=60?2:1,ms=[...new Set(Q.miss)];
 $('#app').innerHTML=`<h1>🎉 完成啦!</h1><div class="card c"><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="q">${Q.right} / ${Q.total}</div><p>${p>=90?'太厲害了!':p>=60?'做得很好,繼續加油!':'多練習幾次就會進步喔!'}</p>${ms.length?'<p style="margin:0">這幾個下次再練習:</p>'+ms.map(k=>`<div style="font-size:20px">${esc(lbl(k))}</div>`).join(''):''}</div>
<button class="p" data-a="start" data-m="${Q.m}">再玩一次 🎈</button><button class="p" style="background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 5px 0 var(--line)" data-a="home">回首頁</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='start')start(b.dataset.m);else if(a==='opt')answer(b.dataset.v);else if(a==='submit')answer($('#ans').value);else if(a==='next')next();else if(a==='home')home();
 else if(a==='say')(cur.snd?playL(cur.snd):say(cur.say));else if(a==='say2')speakAns();else if(a==='sayv')say(b.dataset.v);else if(a==='sayw')say(b.dataset.w);
 else if(a==='phlearn')phlearn();else if(a==='phpick'){const i=(+b.dataset.i+26)%26;phlearn(i);playL(LET[i].l)}else if(a==='phs')playL(b.dataset.l);else if(a==='phw')say(LET[+b.dataset.i].w);
 else if(a==='cat'){CAT=b.dataset.v;S.set('k_cat',CAT);home()}
 else if(a==='rate'){RATE=RATE<.6?.7:RATE<.8?.9:.5;S.set('k_rate',RATE);b.textContent='🐢 語速:'+Math.round(RATE*100)+'%';say('Hello, nice to meet you')}
 else if(a==='auto'){AUTO=!AUTO;S.set('k_auto',AUTO);b.textContent=AUTO?'🔊 自動發音:開':'🔇 自動發音:關'}
 else if(a==='clearcat'){if(confirm('確定清空這個分類的作答紀錄?')){delete stat[CAT];save();home()}}
 else if(a==='clearall'){if(confirm('確定清空所有作答紀錄與錯題本?無法復原。')){stat={};wrong={};save();home()}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!Q||!cur)return;if(answered)next();else if(cur.write)answer($('#ans').value)});
home();
</script></body></html>
